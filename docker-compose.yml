name: krypto-steuer

# Lokale Entwicklung. Alle Ports sind nur an 127.0.0.1 gebunden.
# Die Defaults (…_dev_only) sind absichtlich nur für lokal; eigene Werte über .env setzen.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kryptosteuer}
      POSTGRES_USER: ${POSTGRES_USER:-kryptosteuer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krypto_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-kryptosteuer};Username=${POSTGRES_USER:-kryptosteuer};Password=${POSTGRES_PASSWORD:-krypto_dev_only}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # Optional: docker compose --profile tools up
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_dev_only}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/misc/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
